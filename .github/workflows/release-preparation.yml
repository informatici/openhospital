name: Prepare Open Hospital release branches

# Required repository variable: RELEASE_PREP_CONFIG_JSON
#
# Configure the five repositories that require release preparation explicitly;
# preflight rejects missing/placeholder data. Schema (exactly five entries are
# required):
# [
#   {
#     "name": "core|gui|ui|api|doc",
#     "repository": "OWNER/REPOSITORY",
#     "maven": true,
#     "license": true,
#     "maven_properties": ["exact.property.name"],
#     "dependencies": [
#       {"group_id":"exact.group", "artifact_id":"exact-artifact"}
#     ],
#     "properties_files": [
#       {"file":"exact/path.properties", "key":"exact.key", "value":"${VERSION}"}
#     ],
#     "text_replacements": [
#       {
#         "file":"exact/documentation/path",
#         "pattern":"escaped regex with one version value to replace",
#         "replacement":"${VERSION}",
#         "expected_matches":1
#       }
#     ]
#   }
# ]
#
# Checklist-derived constraints:
# - names must be exactly: core, gui, ui, api, doc
# - license=true must be set exactly for: core, gui, api
# - gui must include rsc/version.properties in properties_files
# - doc must contain explicit text_replacements for manual/version updates
#
# Required GitHub App credentials:
# - repository variable RELEASE_APP_CLIENT_ID: Client ID of the installed App
# - repository secret RELEASE_APP_PRIVATE_KEY: complete PEM private key
# The App must be installed on the five repositories with Contents: read/write.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version in X.Y.Z form (without v)
        required: true
        type: string
      source_ref:
        description: Source X.Y.Z (resolved as tag vX.Y.Z), branch, tag, or SHA
        required: true
        default: develop
        type: string
      dry_run:
        description: Validate and compute changes, but do not push
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: openhospital-release-prep-${{ inputs.version }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CONFIG_JSON: ${{ vars.RELEASE_PREP_CONFIG_JSON }}
  VERSION: ${{ inputs.version }}
  SOURCE_INPUT: ${{ inputs.source_ref }}
  DRY_RUN: ${{ inputs.dry_run }}

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.config.outputs.matrix }}
    steps:
      - name: Resolve release branch name
        run: echo "RELEASE_BRANCH=release_${VERSION//./_}" >>"$GITHUB_ENV"

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: informatici
          repositories: |
            openhospital-core
            openhospital-gui
            openhospital-api
            openhospital-ui
            openhospital-doc
          permission-contents: write

      - name: Validate inputs and configuration
        id: config
        env:
          CONFIG: ${{ env.CONFIG_JSON }}
        run: |
          set -Eeuo pipefail

          fail() { echo "::error::$*"; exit 1; }

          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || fail "version must have X.Y.Z form (for example 1.15.0)"
          [[ -n "$SOURCE_INPUT" ]] || fail "source_ref cannot be empty"
          if [[ ! "$SOURCE_INPUT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            git check-ref-format --branch "$SOURCE_INPUT" >/dev/null 2>&1 \
              || fail "source_ref must be X.Y.Z or a valid Git branch/tag name"
          fi
          [[ -n "${CONFIG:-}" ]] \
            || fail "Missing RELEASE_PREP_CONFIG_JSON repository variable"

          jq -e 'type == "array" and length == 5' <<<"$CONFIG" >/dev/null \
            || fail "RELEASE_PREP_CONFIG_JSON must be a JSON array of exactly five repositories"

          expected='["api","core","doc","gui","ui"]'
          actual="$(jq -c '[.[].name] | sort' <<<"$CONFIG")"
          [[ "$actual" == "$expected" ]] \
            || fail "Configured names must be exactly: api, core, doc, gui, ui"

          duplicates="$(jq -r 'group_by(.repository)[] | select(length > 1) | .[0].repository' <<<"$(jq -c 'sort_by(.repository)' <<<"$CONFIG")")"
          [[ -z "$duplicates" ]] || fail "Duplicate repository slug(s): $duplicates"

          jq -e 'all(.[].repository;
              type == "string" and
              test("^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$") and
              (test("REPLACE|TODO|UNKNOWN"; "i") | not))' <<<"$CONFIG" >/dev/null \
            || fail "Every repository must be an explicit OWNER/REPOSITORY slug with no placeholder"

          jq -e '[.. | strings |
              select(test("^(REPLACE_WITH_|TODO($|_)|UNKNOWN($|_))"; "i"))] |
            length == 0' <<<"$CONFIG" >/dev/null \
            || fail "Configuration still contains a REPLACE/TODO/UNKNOWN placeholder"

          license_names="$(jq -c '[.[] | select(.license == true) | .name] | sort' <<<"$CONFIG")"
          [[ "$license_names" == '["api","core","gui"]' ]] \
            || fail "license=true must be set exactly for api, core, and gui"

          jq -e '.[] |
            has("maven") and has("license") and
            has("maven_properties") and has("dependencies") and
            has("properties_files") and has("text_replacements") and
            ((.maven // false) | type == "boolean") and
            ((.license // false) | type == "boolean") and
            ((.maven_properties // []) | type == "array") and
            ((.dependencies // []) | type == "array") and
            ((.properties_files // []) | type == "array") and
            ((.text_replacements // []) | type == "array")' <<<"$CONFIG" >/dev/null \
            || fail "One or more repository configuration fields has the wrong type"

          jq -e '.[] | select(.maven == true) |
            ((.maven_properties // []) | all(.[]; type == "string" and length > 0)) and
            ((.dependencies // []) | all(.[];
              (.group_id | type == "string" and length > 0) and
              (.artifact_id | type == "string" and length > 0)))' <<<"$CONFIG" >/dev/null \
            || fail "Maven property/dependency mappings must be explicit and non-empty"

          jq -e '.[] | (.properties_files // []) | all(.[];
            (.file | type == "string" and length > 0) and
            (.key | type == "string" and length > 0) and
            (.value | type == "string" and
              test("\\$\\{VERSION(_MAJOR|_MINOR|_PATCH)?\\}")))' <<<"$CONFIG" >/dev/null \
            || fail "properties_files entries require file, key, and a supported version placeholder"

          jq -e '.[] | (.text_replacements // []) | all(.[];
            (.file | type == "string" and length > 0) and
            (.pattern | type == "string" and length > 0) and
            (.replacement | type == "string" and contains("${VERSION}")) and
            (.expected_matches | type == "number" and . >= 1))' <<<"$CONFIG" >/dev/null \
            || fail "text_replacements require file, pattern, replacement with \${VERSION}, and expected_matches >= 1"

          jq -e '.[] | select(.name == "gui") |
            ([.properties_files[]? |
              select(.file == "rsc/version.properties") | .key] | sort) ==
            ["VER_MAJOR","VER_MINOR","VER_RELEASE"]' <<<"$CONFIG" >/dev/null \
            || fail "GUI mapping must define VER_MAJOR, VER_MINOR, and VER_RELEASE in rsc/version.properties"

          jq -e '.[] | select(.name == "doc") |
            (.text_replacements | length > 0)' <<<"$CONFIG" >/dev/null \
            || fail "Documentation mapping missing: doc.text_replacements must explicitly identify every version update"

          compact="$(jq -c '.' <<<"$CONFIG")"
          echo "matrix=$compact" >>"$GITHUB_OUTPUT"

      - name: Verify repository access, source refs, and target branches
        env:
          CONFIG: ${{ env.CONFIG_JSON }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -Eeuo pipefail

          # Repository .permissions.push/pull/admin describes user roles and is
          # not meaningful for a GitHub App installation token. Token creation
          # above explicitly requests contents:write and fails if the App has
          # not been granted that permission. Here we verify repository scope.
          accessible_repositories="$(
            gh api /installation/repositories \
              --paginate \
              --jq '.repositories[].full_name'
          )"

          while IFS= read -r repo; do
            echo "Checking $repo"
            grep -Fqx "$repo" <<<"$accessible_repositories" \
              || { echo "::error::GitHub App token cannot access $repo"; exit 1; }

            if gh api "repos/$repo/git/ref/heads/$RELEASE_BRANCH" >/dev/null 2>&1; then
              echo "Release branch already exists and will be reused: $repo#$RELEASE_BRANCH"
            else
              source_ref="$SOURCE_INPUT"
              if [[ "$SOURCE_INPUT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                source_ref="v$SOURCE_INPUT"
              fi
              encoded_source="$(jq -rn --arg v "$source_ref" '$v|@uri')"
              gh api "repos/$repo/commits/$encoded_source" >/dev/null 2>&1 \
                || { echo "::error::Release branch is missing and source '$source_ref' does not exist in $repo"; exit 1; }
              echo "Resolved source for $repo: $source_ref"
              echo "Release branch will be created from $source_ref: $repo#$RELEASE_BRANCH"
            fi
          done < <(jq -r '.[].repository' <<<"$CONFIG_JSON")

      - name: Preflight summary
        run: |
          {
            echo "## Release preparation preflight"
            echo ""
            echo "- Version: \`$VERSION\`"
            echo "- Release branch: \`$RELEASE_BRANCH\`"
            echo "- Requested source for missing branches: \`$SOURCE_INPUT\`"
            echo "- Dry run: \`$DRY_RUN\`"
            echo "- Configuration: validated for five repositories"
          } >>"$GITHUB_STEP_SUMMARY"

  prepare:
    name: Prepare ${{ matrix.repo.name }}
    needs: preflight
    if: ${{ needs.preflight.result == 'success' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    env:
      REPOSITORY: ${{ matrix.repo.repository }}
      REPO_CONFIG: ${{ toJSON(matrix.repo) }}
    steps:
      - name: Resolve release branch name
        run: echo "RELEASE_BRANCH=release_${VERSION//./_}" >>"$GITHUB_ENV"

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: informatici
          # Full OWNER/REPOSITORY entries are supported when the owner matches.
          # Give each matrix job access only to the repository it prepares.
          repositories: ${{ matrix.repo.repository }}
          permission-contents: write

      - name: Clone repository and create or reuse release branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -Eeuo pipefail
          git config --global user.name "openhospital-release-bot"
          git config --global user.email "openhospital-release-bot@users.noreply.github.com"

          # These repositories are public: clone and fetch anonymously. This
          # avoids using the installation token for read operations. The token
          # is configured only as the push URL below and remains available to
          # gh for the branch-creation API when needed.
          git clone --filter=blob:none "https://github.com/${REPOSITORY}.git" repo
          cd repo
          git fetch origin "+refs/heads/*:refs/remotes/origin/*" --tags
          git remote set-url --push origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"

          if git show-ref --verify --quiet "refs/remotes/origin/$RELEASE_BRANCH"; then
            git checkout -B "$RELEASE_BRANCH" "origin/$RELEASE_BRANCH"
            echo "BRANCH_ACTION=reused" >>"$GITHUB_ENV"
          else
            source_ref="$SOURCE_INPUT"
            if [[ "$SOURCE_INPUT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              source_ref="v$SOURCE_INPUT"
            fi

            base_ref=""
            if git show-ref --verify --quiet "refs/remotes/origin/$source_ref"; then
              base_ref="origin/$source_ref"
            elif git show-ref --verify --quiet "refs/tags/$source_ref"; then
              base_ref="refs/tags/$source_ref"
            elif git rev-parse --verify --quiet "${source_ref}^{commit}" >/dev/null; then
              base_ref="$source_ref"
            fi

            [[ -n "$base_ref" ]] || {
              echo "::error::Cannot resolve source '$source_ref' in $REPOSITORY"
              exit 1
            }

            base_sha="$(git rev-parse "${base_ref}^{commit}")"

            # In live mode create the remote ref first, pointing exactly at the
            # requested source. The later Git push then contains only release
            # preparation changes and does not need Workflows permission merely
            # because the source tree already contains .github/workflows files.
            if [[ "$DRY_RUN" != "true" ]]; then
              gh api --method POST "repos/$REPOSITORY/git/refs" \
                -f ref="refs/heads/$RELEASE_BRANCH" \
                -f sha="$base_sha" >/dev/null
              git fetch origin "+refs/heads/$RELEASE_BRANCH:refs/remotes/origin/$RELEASE_BRANCH"
              echo "BRANCH_ACTION=created remotely from $base_ref" >>"$GITHUB_ENV"
            else
              echo "BRANCH_ACTION=would be created from $base_ref" >>"$GITHUB_ENV"
            fi

            git checkout -B "$RELEASE_BRANCH" "$base_ref"
          fi

      - name: Set up Java
        if: ${{ matrix.repo.maven == true }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: repo/pom.xml

      - name: Format licenses on the release branch
        if: ${{ matrix.repo.license == true }}
        working-directory: repo
        run: |
          set -Eeuo pipefail
          mvn -B -ntp license:format

          # Release preparation must never create or change Actions workflows.
          # Some license-plugin configurations also scan YAML files, so retain
          # the workflow files exactly as they are on the release branch.
          if ! git diff --quiet -- .github/workflows 2>/dev/null; then
            echo "::warning::license:format touched .github/workflows; those changes were excluded"
            git restore --worktree -- .github/workflows
          fi

      - name: Set Maven project and internal dependency versions
        if: ${{ matrix.repo.maven == true }}
        working-directory: repo
        run: |
          set -Eeuo pipefail
          [[ -f pom.xml ]] \
            || { echo "::error::Configured as Maven but pom.xml is missing in $REPOSITORY"; exit 1; }

          mvn -B -ntp versions:set \
            -DnewVersion="$VERSION" \
            -DprocessAllModules=true \
            -DgenerateBackupPoms=false

          while IFS= read -r property; do
            mvn -B -ntp versions:set-property \
              -Dproperty="$property" \
              -DnewVersion="$VERSION" \
              -DgenerateBackupPoms=false
          done < <(jq -r '.maven_properties[]?' <<<"$REPO_CONFIG")

          while IFS=$'\t' read -r group artifact; do
            mvn -B -ntp versions:use-dep-version \
              -Dincludes="$group:$artifact" \
              -DdepVersion="$VERSION" \
              -DforceVersion=true \
              -DprocessDependencyManagement=true \
              -DgenerateBackupPoms=false
          done < <(jq -r '.dependencies[]? | [.group_id,.artifact_id] | @tsv' <<<"$REPO_CONFIG")

          if grep -RIn --include='pom.xml' \
              -E "<version>${VERSION//./\\.}-SNAPSHOT</version>" .; then
            echo "::error::Target project/dependency version still has -SNAPSHOT in a pom.xml"
            exit 1
          fi

      - name: Update exact properties-file mappings
        working-directory: repo
        env:
          RULES_JSON: ${{ toJSON(matrix.repo.properties_files) }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, pathlib, re, sys

          version = os.environ["VERSION"]
          major, minor, patch = version.split(".")
          rules = json.loads(os.environ.get("RULES_JSON") or "[]")
          for rule in rules:
              path = pathlib.Path(rule["file"])
              if not path.is_file():
                  sys.exit(f"Configured properties file does not exist: {path}")
              key = rule["key"]
              value = (rule["value"]
                       .replace("${VERSION}", version)
                       .replace("${VERSION_MAJOR}", major)
                       .replace("${VERSION_MINOR}", minor)
                       .replace("${VERSION_PATCH}", patch))
              original = path.read_text(encoding="utf-8")
              pattern = re.compile(rf"(?m)^({re.escape(key)}\s*[=:]\s*).*$")
              updated, count = pattern.subn(lambda m: m.group(1) + value, original)
              if count != 1:
                  sys.exit(f"Expected exactly one key '{key}' in {path}; found {count}")
              if updated != original:
                  path.write_text(updated, encoding="utf-8", newline="")
          PY

      - name: Apply explicit documentation and text mappings
        working-directory: repo
        env:
          RULES_JSON: ${{ toJSON(matrix.repo.text_replacements) }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, pathlib, re, sys

          version = os.environ["VERSION"]
          rules = json.loads(os.environ.get("RULES_JSON") or "[]")
          for rule in rules:
              path = pathlib.Path(rule["file"])
              if not path.is_file():
                  sys.exit(f"Configured text file does not exist: {path}")
              original = path.read_text(encoding="utf-8")
              replacement = rule["replacement"].replace("${VERSION}", version)
              try:
                  updated, count = re.subn(rule["pattern"], replacement, original,
                                           flags=re.MULTILINE)
              except re.error as exc:
                  sys.exit(f"Invalid regex for {path}: {exc}")
              expected = int(rule["expected_matches"])
              if count != expected:
                  sys.exit(f"Expected {expected} matches in {path}; found {count}")
              if updated != original:
                  path.write_text(updated, encoding="utf-8", newline="")
          PY

      - name: Verify target state
        working-directory: repo
        run: |
          set -Eeuo pipefail

          # Maven's effective model must be readable after all edits.
          if [[ "$(jq -r '.maven // false' <<<"$REPO_CONFIG")" == "true" ]]; then
            mvn -B -ntp -DskipTests help:effective-pom -Doutput=/tmp/effective-pom.xml
            [[ -s /tmp/effective-pom.xml ]]
          fi

          # A rerun must converge: applying the transformations a second time is
          # represented by the same working tree, so only the intended diff remains.
          git diff --check
          git status --short

      - name: Commit only when content changed and push safely
        id: publish
        working-directory: repo
        run: |
          set -Eeuo pipefail

          if git diff --quiet --exit-code; then
            commit_action="no content changes"
            changed_files="0"
          else
            changed_files="$(git status --short | wc -l | xargs)"
            git add -A
            if [[ "$(jq -r '.license // false' <<<"$REPO_CONFIG")" != "true" ]]; then
              git diff --cached --check
            fi
            git commit -m "chore: prepare release $VERSION"
            commit_action="committed $(git rev-parse --short HEAD)"
          fi

          if [[ "$DRY_RUN" == "true" ]]; then
            push_action="dry run; nothing pushed"
          else
            # --force-with-lease is intentionally not used. Concurrent or manual
            # updates cause a safe failure and can be reconciled before rerunning.
            git push --set-upstream origin "$RELEASE_BRANCH"
            push_action="branch synchronized"
          fi

          mkdir -p "$RUNNER_TEMP/release-report"
          jq -n \
            --arg repository "$REPOSITORY" \
            --arg branch "$RELEASE_BRANCH" \
            --arg branch_action "$BRANCH_ACTION" \
            --arg changed_files "$changed_files" \
            --arg content "$commit_action" \
            --arg push "$push_action" \
            --arg license "$(jq -r '.license // false' <<<"$REPO_CONFIG")" \
            '{repository:$repository, branch:$branch, branch_action:$branch_action,
              changed_files:($changed_files|tonumber), content:$content,
              push:$push, license:($license == "true")}' \
            >"$RUNNER_TEMP/release-report/result.json"

          {
            echo "## $REPOSITORY"
            echo ""
            echo "- Branch: \`$RELEASE_BRANCH\` ($BRANCH_ACTION)"
            echo "- Content: $commit_action"
            echo "- Push: $push_action"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Upload repository result
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: release-report-${{ matrix.repo.name }}
          path: ${{ runner.temp }}/release-report/result.json
          if-no-files-found: error
          retention-days: 7

  summary:
    name: Final summary
    needs: [preflight, prepare]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Collect repository results
        if: ${{ needs.prepare.result != 'skipped' }}
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          pattern: release-report-*
          path: release-reports

      - name: Report outcome
        run: |
          {
            echo "# Open Hospital release preparation"
            echo ""
            echo "- Version: \`$VERSION\`"
            echo "- Requested source: \`$SOURCE_INPUT\`"
            if [[ "$DRY_RUN" == "true" ]]; then
              echo "- Mode: **DRY RUN — no remote branch was changed**"
            else
              echo "- Mode: **LIVE — changes were pushed**"
            fi
            echo "- Preflight: **${{ needs.preflight.result }}**"
            echo "- Repository preparation: **${{ needs.prepare.result }}**"
            echo ""

            if compgen -G 'release-reports/*/result.json' >/dev/null; then
              echo "## Repository results"
              echo ""
              echo "| Repository | Release branch | Branch | Files changed | Commit | Push | Licenses |"
              echo "|---|---|---|---:|---|---|---|"
              while IFS= read -r report; do
                jq -r '[.repository, ("`" + .branch + "`"), .branch_action,
                         (.changed_files|tostring), .content, .push,
                         (if .license then "formatted" else "not configured" end)]
                       | "| " + join(" | ") + " |"' "$report"
              done < <(find release-reports -name result.json -type f | sort)
              echo ""
            else
              echo "> No repository result was produced. Check the failed preflight or matrix job logs."
              echo ""
            fi

            if [[ "${{ needs.prepare.result }}" == "success" ]]; then
              if [[ "$DRY_RUN" == "true" ]]; then
                echo "## Next step"
                echo ""
                echo "Review the table above. To apply exactly these operations, rerun the workflow with **Validate and compute changes, but do not push** unchecked."
              else
                echo "## Outcome"
                echo ""
                echo "Preparation completed. Existing branches were reused, missing branches were created, and only real changes were committed and pushed."
              fi
            else
              echo "## Action required"
              echo ""
              echo "Preparation did not complete. Open the failed preflight or repository matrix job. Successful work is safe to reuse on the next run."
            fi
          } >>"$GITHUB_STEP_SUMMARY"

          [[ "${{ needs.preflight.result }}" == "success" ]]
          [[ "${{ needs.prepare.result }}" == "success" ]]
