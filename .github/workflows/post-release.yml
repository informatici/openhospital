name: Open Hospital post-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version in X.Y.Z form
        required: true
        type: string
  release:
    types: [released]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: post-release-${{ github.event.release.tag_name || inputs.version }}
  cancel-in-progress: false

jobs:
  post-release:
    name: Verify and apply post-release plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VERSION: ${{ inputs.version || '' }}
      JIRA_CLOUD_ID: ${{ secrets.JIRA_CLOUD_ID }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      GH_OWNER: informatici
      EVENT_NAME: ${{ github.event_name }}
      EVENT_TAG: ${{ github.event.release.tag_name || '' }}
      EVENT_DRAFT: ${{ github.event.release.draft || false }}
      EVENT_PRERELEASE: ${{ github.event.release.prerelease || false }}
      EVENT_PUBLISHED_AT: ${{ github.event.release.published_at || '' }}
      EVENT_RELEASE_URL: ${{ github.event.release.html_url || '' }}
      RELEASE_APP_CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

    steps:
      - name: Validate inputs and secrets
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ "$EVENT_NAME" == "release" ]]; then
            [[ "$EVENT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "::error::release tag must have vX.Y.Z form"
              exit 1
            }
            [[ "$EVENT_DRAFT" == "false" && "$EVENT_PRERELEASE" == "false" ]] || {
              echo "::error::released event is not a final non-draft release"
              exit 1
            }
            [[ -n "$EVENT_PUBLISHED_AT" ]] || {
              echo "::error::release event has no published_at timestamp"
              exit 1
            }
            [[ -n "$RELEASE_APP_CLIENT_ID" ]] || {
              echo "::error::Missing RELEASE_APP_CLIENT_ID repository variable"
              exit 1
            }
            [[ -n "$RELEASE_APP_PRIVATE_KEY" ]] || {
              echo "::error::Missing RELEASE_APP_PRIVATE_KEY secret"
              exit 1
            }
            VERSION="${EVENT_TAG#v}"
            DRY_RUN=false
            RELEASE_DATE="${EVENT_PUBLISHED_AT:0:10}"
          else
            DRY_RUN=true
            RELEASE_DATE=""
          fi

          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::version must have X.Y.Z form (for example 1.15.2)"
            exit 1
          }

          [[ -n "$JIRA_CLOUD_ID" ]] || {
            echo "::error::Missing JIRA_CLOUD_ID secret"
            exit 1
          }

          [[ "$JIRA_CLOUD_ID" =~ ^[0-9a-fA-F-]{36}$ ]] || {
            echo "::error::JIRA_CLOUD_ID does not have UUID form"
            exit 1
          }

          [[ -n "$JIRA_API_TOKEN" ]] || {
            echo "::error::Missing JIRA_API_TOKEN secret"
            exit 1
          }

          {
            echo "VERSION=$VERSION"
            echo "DRY_RUN=$DRY_RUN"
            echo "RELEASE_DATE=$RELEASE_DATE"
            echo "RELEASE_TAG=v$VERSION"
            echo "RELEASE_BRANCH=release_${VERSION//./_}"
            echo "GITHUB_BLOCKED=0"
            echo "JIRA_BLOCKED=0"
          } >>"$GITHUB_ENV"

      - name: Generate live GitHub App token
        if: ${{ github.event_name == 'release' }}
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ env.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ env.RELEASE_APP_PRIVATE_KEY }}
          owner: informatici
          repositories: |
            openhospital
            openhospital-core
            openhospital-gui
            openhospital-api
            openhospital-ui
            openhospital-doc
          permission-contents: write
          permission-pull-requests: write

      - name: Select live GitHub credentials
        if: ${{ github.event_name == 'release' }}
        shell: bash
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -Eeuo pipefail
          echo "::add-mask::$APP_TOKEN"
          echo "GH_TOKEN=$APP_TOKEN" >>"$GITHUB_ENV"

      - name: Inspect GitHub release
        shell: bash
        run: |
          set -Eeuo pipefail

          release_file="$RUNNER_TEMP/github-release.json"
          if gh api "repos/$GH_OWNER/openhospital/releases/tags/$RELEASE_TAG" >"$release_file" 2>/dev/null; then
            draft="$(jq -r '.draft' "$release_file")"
            prerelease="$(jq -r '.prerelease' "$release_file")"
            published_at="$(jq -r '.published_at // "not published"' "$release_file")"
            release_url="$(jq -r '.html_url' "$release_file")"

            if [[ "$draft" == "false" && "$prerelease" == "false" ]]; then
              if [[ "$DRY_RUN" == "true" ]]; then
                eligibility="final release; a release-triggered run would apply changes"
              else
                eligibility="final release; post-release changes enabled"
              fi
            else
              eligibility="not final; publish-triggered changes would be skipped"
            fi
          else
            if [[ "$DRY_RUN" == "false" ]]; then
              echo "::error::The triggering release $RELEASE_TAG could not be read"
              exit 1
            fi
            draft="not found"
            prerelease="not found"
            published_at="not published"
            release_url="—"
            eligibility="release not currently visible by tag; dry-run continues"
          fi

          {
            if [[ "$DRY_RUN" == "true" ]]; then
              title="Open Hospital post-release dry-run"
              mode="**DRY RUN — no remote state is changed**"
            else
              title="Open Hospital post-release"
              mode="**LIVE — idempotent post-release changes are enabled**"
            fi

            echo "# $title"
            echo ""
            echo "- Version: \`$VERSION\`"
            echo "- Tag: \`$RELEASE_TAG\`"
            echo "- Release branch: \`$RELEASE_BRANCH\`"
            echo "- Mode: $mode"
            echo ""
            echo "## Aggregate GitHub release"
            echo ""
            echo "| Draft | Prerelease | Published at | URL | Eligibility |"
            echo "|---|---|---|---|---|"
            echo "| $draft | $prerelease | $published_at | $release_url | $eligibility |"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Analyze merge-back pull requests
        shell: bash
        run: |
          set -Eeuo pipefail

          repositories=(
            openhospital-core
            openhospital-gui
            openhospital-api
            openhospital-ui
            openhospital-doc
          )

          rows="$RUNNER_TEMP/merge-back-rows.md"
          : >"$rows"
          blocked=0

          for repository in "${repositories[@]}"; do
            full_repo="$GH_OWNER/$repository"
            repo_dir="$RUNNER_TEMP/$repository"
            branch_sha=""
            tag_sha=""
            relation=""
            pr_state="would create"
            merge_test="not run"
            action=""
            ref_matches=false
            already_contained=false

            if ! branch_sha="$(gh api "repos/$full_repo/git/ref/heads/$RELEASE_BRANCH" --jq '.object.sha' 2>/dev/null)"; then
              echo "::error::$full_repo is missing $RELEASE_BRANCH"
              printf '| %s | missing | — | — | blocked: release branch missing |\n' \
                "$repository" >>"$rows"
              blocked=1
              continue
            fi

            if ! tag_sha="$(gh api "repos/$full_repo/commits/$RELEASE_TAG" --jq '.sha' 2>/dev/null)"; then
              echo "::error::$full_repo is missing $RELEASE_TAG"
              printf '| %s | branch exists; tag missing | — | — | blocked: tag missing |\n' \
                "$repository" >>"$rows"
              blocked=1
              continue
            fi

            if [[ "$branch_sha" == "$tag_sha" ]]; then
              ref_state="\`$RELEASE_BRANCH\` matches \`$RELEASE_TAG\`; target \`develop\`"
              ref_matches=true
            else
              ref_state="**mismatch:** \`$RELEASE_BRANCH\` != \`$RELEASE_TAG\`; target \`develop\`"
              echo "::error::$full_repo branch/tag SHA mismatch"
              blocked=1
            fi

            prs="$(gh api \
              "repos/$full_repo/pulls?state=all&head=$GH_OWNER:$RELEASE_BRANCH&base=develop&per_page=100")"
            pr_count="$(jq 'length' <<<"$prs")"

            if (( pr_count > 1 )); then
              pr_state="**ambiguous: $pr_count exact PRs**"
              echo "::error::$full_repo has $pr_count PRs for the exact head/base pair"
              blocked=1
            elif (( pr_count == 1 )); then
              pr_url="$(jq -r '.[0].html_url' <<<"$prs")"
              state="$(jq -r '.[0].state' <<<"$prs")"
              merged="$(jq -r '.[0].merged_at != null' <<<"$prs")"
              if [[ "$merged" == "true" ]]; then
                pr_state="[already merged]($pr_url)"
              elif [[ "$state" == "open" ]]; then
                pr_state="[open]($pr_url)"
              else
                pr_state="[**closed without merge**]($pr_url)"
                echo "::error::$full_repo has a closed-unmerged exact PR"
                blocked=1
              fi
            fi

            git clone --quiet --filter=blob:none --no-checkout \
              "https://github.com/$full_repo.git" "$repo_dir"
            git -C "$repo_dir" fetch --quiet origin \
              "+refs/heads/develop:refs/remotes/origin/develop" \
              "+refs/heads/$RELEASE_BRANCH:refs/remotes/origin/$RELEASE_BRANCH"

            read -r develop_only release_only < <(
              git -C "$repo_dir" rev-list --left-right --count \
                "origin/develop...origin/$RELEASE_BRANCH"
            )
            relation="develop-only: $develop_only; release-only: $release_only"

            if git -C "$repo_dir" merge-base --is-ancestor \
                "origin/$RELEASE_BRANCH" origin/develop; then
              already_contained=true
              merge_test="already contained"
              action="no PR needed"
              if [[ "$pr_state" == "would create" ]]; then
                pr_state="not needed"
              fi
            else
              git -C "$repo_dir" checkout --quiet -B dry-run-develop origin/develop
              set +e
              git -C "$repo_dir" -c user.name=dry-run -c user.email=dry-run@example.invalid \
                merge --no-commit --no-ff "origin/$RELEASE_BRANCH" \
                >"$repo_dir/merge.log" 2>&1
              merge_rc=$?
              set -e

              if (( merge_rc == 0 )); then
                merge_test="clean"
                if [[ "$pr_state" == "would create" ]]; then
                  action="would create PR"
                else
                  action="reuse existing PR state"
                fi
              else
                conflicts="$(git -C "$repo_dir" diff --name-only --diff-filter=U \
                  | paste -sd ', ' -)"
                [[ -n "$conflicts" ]] || conflicts="merge command failed; inspect logs"
                merge_test="**conflicts:** $conflicts"
                action="manual resolution required"
                echo "::warning::$full_repo trial merge has conflicts: $conflicts"
              fi

              git -C "$repo_dir" merge --abort >/dev/null 2>&1 || true
            fi

            if [[ "$DRY_RUN" == "false" && "$ref_matches" == "true" && \
                  "$already_contained" == "false" && "$pr_count" == "0" ]]; then
              pr_body="$(jq -n \
                --arg title "chore: merge back $VERSION into develop" \
                --arg head "$RELEASE_BRANCH" \
                --arg base "develop" \
                --arg body "Automated merge-back for [$RELEASE_TAG]($EVENT_RELEASE_URL).\n\nCreated by the post-release workflow: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\n\nMerge conflicts are intentionally left for manual resolution. For release-managed POM version fields, retain the values from develop; review all other POM changes manually." \
                '{title:$title, head:$head, base:$base, body:$body}')"

              if created_pr="$(gh api --method POST "repos/$full_repo/pulls" \
                  --input - <<<"$pr_body" 2>"$repo_dir/create-pr.err")"; then
                pr_url="$(jq -r '.html_url' <<<"$created_pr")"
                pr_number="$(jq -r '.number' <<<"$created_pr")"
                pr_state="[created #$pr_number]($pr_url)"
                action="PR created; merge remains subject to repository checks"
              else
                echo "::error::$full_repo merge-back PR creation failed"
                sed 's/^/  /' "$repo_dir/create-pr.err" >&2 || true
                pr_state="**creation failed**"
                action="blocked; rerun is safe"
                blocked=1
              fi
            fi

            printf '| %s | %s | %s | %s | %s — %s |\n' \
              "$repository" "$ref_state" "$pr_state" "$relation" \
              "$merge_test" "$action" >>"$rows"
          done

          {
            echo ""
            echo "## Merge-back analysis"
            echo ""
            echo "| Repository | Source → target | Merge-back PR | Divergence | Trial merge / plan |"
            echo "|---|---|---|---|---|"
            cat "$rows"
            echo ""
            if [[ "$DRY_RUN" == "true" ]]; then
              echo "> Trial merges run only in temporary runner clones. No branch, commit, or PR is created."
            else
              echo "> Trial merges run in temporary runner clones. Missing merge-back PRs are created; existing exact PRs are reused."
            fi
            echo ""
            echo "> Conflicts are never resolved automatically. For release-managed POM version fields, retain the values from \`develop\`; review all other POM changes manually."
          } >>"$GITHUB_STEP_SUMMARY"

          if (( blocked != 0 )); then
            echo "GITHUB_BLOCKED=1" >>"$GITHUB_ENV"
          fi

      - name: Analyze documentation selector branch
        shell: bash
        run: |
          set -Eeuo pipefail

          repository="$GH_OWNER/openhospital-doc"
          if ! tag_sha="$(gh api "repos/$repository/commits/$RELEASE_TAG" \
              --jq '.sha' 2>/dev/null)"; then
            echo "::error::Documentation tag $RELEASE_TAG is missing"
            echo "GITHUB_BLOCKED=1" >>"$GITHUB_ENV"
            {
              echo ""
              echo "## Documentation selector branch"
              echo ""
              echo "| Repository | Branch | State | Planned action |"
              echo "|---|---|---|---|"
              echo "| openhospital-doc | \`$VERSION\` | tag \`$RELEASE_TAG\` missing | blocked |"
            } >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if branch_sha="$(gh api "repos/$repository/git/ref/heads/$VERSION" \
              --jq '.object.sha' 2>/dev/null)"; then
            if [[ "$branch_sha" == "$tag_sha" ]]; then
              state="already correct at \`${tag_sha:0:7}\`"
              plan="nothing"
            else
              state="**mismatch:** branch \`${branch_sha:0:7}\`, tag \`${tag_sha:0:7}\`"
              plan="blocked; never force-move"
              echo "::error::Documentation branch $VERSION points to a different commit"
              echo "GITHUB_BLOCKED=1" >>"$GITHUB_ENV"
            fi
          else
            state="missing; tag at \`${tag_sha:0:7}\`"
            if [[ "$DRY_RUN" == "true" ]]; then
              plan="would create branch \`$VERSION\` from \`$RELEASE_TAG\`"
            else
              ref_body="$(jq -n \
                --arg ref "refs/heads/$VERSION" \
                --arg sha "$tag_sha" \
                '{ref:$ref, sha:$sha}')"
              if gh api --method POST "repos/$repository/git/refs" \
                  --input - <<<"$ref_body" >/dev/null; then
                state="created at \`${tag_sha:0:7}\`"
                plan="branch \`$VERSION\` created from \`$RELEASE_TAG\`"
              else
                state="**creation failed**"
                plan="blocked; rerun is safe"
                echo "::error::Could not create documentation branch $VERSION"
                echo "GITHUB_BLOCKED=1" >>"$GITHUB_ENV"
              fi
            fi
          fi

          {
            echo ""
            echo "## Documentation selector branch"
            echo ""
            echo "| Repository | Branch | State | Planned action |"
            echo "|---|---|---|---|"
            echo "| openhospital-doc | \`$VERSION\` | $state | $plan |"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Verify Jira access, permissions, and release versions
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x

          api="https://api.atlassian.com/ex/jira/${JIRA_CLOUD_ID}/rest/api/3"
          auth_header="Authorization: Bearer ${JIRA_API_TOKEN}"
          work_dir="$(mktemp -d)"
          trap 'rm -rf "$work_dir"' EXIT

          request_json() {
            local url="$1"
            local output="$2"
            local status

            status="$(curl --silent --show-error \
              --output "$output" \
              --write-out '%{http_code}' \
              --header "$auth_header" \
              --header 'Accept: application/json' \
              "$url")"

            if [[ "$status" != "200" ]]; then
              echo "::error::Jira GET failed with HTTP $status for ${url#"$api"}"
              jq -r '.errorMessages[]?, .message? // empty' "$output" 2>/dev/null || true
              return 1
            fi
          }

          release_jira_version() {
            local version_id="$1"
            local output="$2"
            local body status

            body="$(jq -n \
              --arg release_date "$RELEASE_DATE" \
              '{released:true, releaseDate:$release_date}')"
            status="$(curl --silent --show-error \
              --output "$output" \
              --write-out '%{http_code}' \
              --request PUT \
              --header "$auth_header" \
              --header 'Accept: application/json' \
              --header 'Content-Type: application/json' \
              --data "$body" \
              "$api/version/$version_id")"

            if [[ "$status" != "200" ]]; then
              echo "::error::Jira version update failed with HTTP $status for version $version_id"
              jq -r '.errorMessages[]?, .message? // empty' "$output" 2>/dev/null || true
              return 1
            fi
          }

          search_issues() {
            local jql="$1"
            local output="$2"
            local page_file="$work_dir/search-page.json"
            local merged_file="$work_dir/search-merged.json"
            local next_token=""
            local page=0

            printf '[]\n' >"$output"

            while true; do
              page=$((page + 1))
              if (( page > 1000 )); then
                echo "::error::Jira search exceeded 1000 pages"
                return 1
              fi

              body="$(jq -n \
                --arg jql "$jql" \
                --arg next "$next_token" \
                '{jql:$jql, fields:["summary","status"], maxResults:100}
                 + (if $next == "" then {} else {nextPageToken:$next} end)')"

              status="$(curl --silent --show-error \
                --output "$page_file" \
                --write-out '%{http_code}' \
                --request POST \
                --header "$auth_header" \
                --header 'Accept: application/json' \
                --header 'Content-Type: application/json' \
                --data "$body" \
                "$api/search/jql")"

              if [[ "$status" != "200" ]]; then
                echo "::error::Jira JQL search failed with HTTP $status"
                jq -r '.errorMessages[]?, .message? // empty' "$page_file" 2>/dev/null || true
                return 1
              fi

              jq -s '.[0] + .[1]' \
                "$output" <(jq '.issues // []' "$page_file") >"$merged_file"
              mv "$merged_file" "$output"

              next_token="$(jq -r '.nextPageToken // empty' "$page_file")"
              [[ -n "$next_token" ]] || break
            done
          }

          {
            echo ""
            echo "## Jira access and release readiness"
            echo ""
            echo "- Jira Cloud ID format: valid"
            if [[ "$DRY_RUN" == "true" ]]; then
              echo "- Jira calls: authenticated reads plus read-only JQL searches"
            else
              echo "- Jira calls: readiness is rechecked immediately before an idempotent version update"
              echo "- GitHub publication date used for Jira: \`$RELEASE_DATE\`"
            fi
          } >>"$GITHUB_STEP_SUMMARY"

          failed=0
          access_summary="$work_dir/jira-access.md"
          release_summary="$work_dir/jira-releases.md"
          pending_summary="$work_dir/jira-pending.md"
          : >"$access_summary"
          : >"$release_summary"
          : >"$pending_summary"

          for project in OP OH2; do
            permissions_file="$work_dir/${project}-permissions.json"
            versions_file="$work_dir/${project}-versions.json"
            all_issues_file="$work_dir/${project}-all-issues.json"
            pending_issues_file="$work_dir/${project}-pending-issues.json"

            if ! request_json \
              "$api/mypermissions?projectKey=$project&permissions=BROWSE_PROJECTS,ADMINISTER_PROJECTS" \
              "$permissions_file"; then
              echo "- **$project:** permission check failed ❌" >>"$access_summary"
              echo "| $project | — | — | — | permission check failed | **blocked** |" \
                >>"$release_summary"
              failed=1
              continue
            fi

            browse="$(jq -r '.permissions.BROWSE_PROJECTS.havePermission // false' "$permissions_file")"
            administer="$(jq -r '.permissions.ADMINISTER_PROJECTS.havePermission // false' "$permissions_file")"

            if [[ "$browse" == "true" && "$administer" == "true" ]]; then
              echo "- **$project:** Browse Projects ✅; Administer Projects ✅" >>"$access_summary"
            else
              echo "- **$project:** Browse Projects=$browse; Administer Projects=$administer ❌" \
                >>"$access_summary"
            fi

            if [[ "$browse" != "true" || "$administer" != "true" ]]; then
              echo "::error::Service account lacks required Jira permissions in $project (browse=$browse, administer=$administer)"
              failed=1
            fi

            if ! request_json "$api/project/$project/versions" "$versions_file"; then
              echo "| $project | — | — | — | version lookup failed | **blocked** |" \
                >>"$release_summary"
              failed=1
              continue
            fi

            matches="$(jq --arg version "$VERSION" '[.[] | select(.name == $version)] | length' "$versions_file")"
            if [[ "$matches" != "1" ]]; then
              echo "::error::Expected exactly one Jira version '$VERSION' in $project; found $matches"
              echo "| $project | — | — | — | exact matches: $matches | **blocked** |" \
                >>"$release_summary"
              failed=1
              continue
            fi

            version_id="$(jq -r --arg version "$VERSION" '.[] | select(.name == $version) | .id' "$versions_file")"
            released="$(jq -r --arg version "$VERSION" '.[] | select(.name == $version) | .released' "$versions_file")"
            release_date="$(jq -r --arg version "$VERSION" '.[] | select(.name == $version) | .releaseDate // "not set"' "$versions_file")"

            all_jql="project = $project AND fixVersion = $version_id ORDER BY key"
            pending_jql="project = $project AND fixVersion = $version_id AND statusCategory != Done ORDER BY key"

            if ! search_issues "$all_jql" "$all_issues_file"; then
              echo "| $project | [$VERSION](https://openhospital.atlassian.net/projects/$project/versions/$version_id) | error | error | JQL search failed | **blocked** |" \
                >>"$release_summary"
              failed=1
              continue
            fi

            if ! search_issues "$pending_jql" "$pending_issues_file"; then
              echo "| $project | [$VERSION](https://openhospital.atlassian.net/projects/$project/versions/$version_id) | error | error | pending search failed | **blocked** |" \
                >>"$release_summary"
              failed=1
              continue
            fi

            issue_count="$(jq 'length' "$all_issues_file")"
            pending_count="$(jq 'length' "$pending_issues_file")"

            included_codes="$(jq -r \
              --arg site "https://openhospital.atlassian.net" \
              '[.[] | "[\(.key)](\($site)/browse/\(.key))"] |
               if length == 0 then "none" else join(", ") end' \
              "$all_issues_file")"
            pending_codes="$(jq -r \
              --arg site "https://openhospital.atlassian.net" \
              '[.[] | "[\(.key)](\($site)/browse/\(.key))"] |
               if length == 0 then "none" else join(", ") end' \
              "$pending_issues_file")"

            if [[ "$released" == "true" ]]; then
              current="released; date: $release_date"
            else
              current="unreleased; date: $release_date"
            fi

            if (( pending_count > 0 )); then
              readiness="**blocked**"
              failed=1
              echo "::error::$project version $VERSION has $pending_count issue(s) outside the Done status category"
            elif (( issue_count == 0 )); then
              echo "::warning::$project version $VERSION has no associated issues"
            fi

            if (( pending_count == 0 )) && [[ "$released" == "true" ]]; then
              if [[ "$DRY_RUN" == "false" && "$release_date" != "$RELEASE_DATE" ]]; then
                readiness="**blocked: already released with a different date**"
                failed=1
                echo "::error::$project version $VERSION is already released with date $release_date, expected $RELEASE_DATE"
              else
                readiness="already released"
              fi
            elif (( pending_count == 0 )) && [[ "$released" != "true" && "$DRY_RUN" == "true" ]]; then
              readiness="ready; would publish on final GitHub release"
            elif (( pending_count == 0 )) && [[ "$released" != "true" ]]; then
              if [[ "$GITHUB_BLOCKED" == "1" ]]; then
                readiness="**blocked: GitHub preflight failed**"
                failed=1
              elif [[ "$browse" != "true" || "$administer" != "true" ]]; then
                readiness="**blocked: insufficient permissions**"
                failed=1
              else
                update_file="$work_dir/${project}-version-update.json"
                if release_jira_version "$version_id" "$update_file"; then
                  updated_released="$(jq -r '.released // false' "$update_file")"
                  updated_date="$(jq -r '.releaseDate // "not set"' "$update_file")"
                  if [[ "$updated_released" == "true" && "$updated_date" == "$RELEASE_DATE" ]]; then
                    released="true"
                    release_date="$updated_date"
                    current="released; date: $release_date"
                    readiness="released now"
                  else
                    readiness="**blocked: update verification failed**"
                    failed=1
                    echo "::error::$project Jira update response did not contain the expected released state and date"
                  fi
                else
                  readiness="**blocked: update failed**"
                  failed=1
                fi
              fi
            fi

            if (( issue_count == 0 )); then
              readiness="$readiness; warning: no issues"
            fi

            echo "| $project | [$VERSION](https://openhospital.atlassian.net/projects/$project/versions/$version_id) | **$issue_count:** $included_codes | **$pending_count:** $pending_codes | $current | $readiness |" \
              >>"$release_summary"

            if (( pending_count > 0 )); then
              {
                echo ""
                echo "## Pending issues — $project"
                echo ""
                echo "| Issue | Status | Category | Summary |"
                echo "|---|---|---|---|"
                jq -r \
                  --arg site "https://openhospital.atlassian.net" \
                  '.[] |
                   (.fields.summary // "" | gsub("[|\\r\\n]"; " ")) as $summary |
                   "| [\(.key)](\($site)/browse/\(.key)) | \(.fields.status.name) | \(.fields.status.statusCategory.name) | \($summary) |"' \
                  "$pending_issues_file"
              } >>"$pending_summary"
            fi
          done

          {
            echo ""
            echo "### Jira access checks"
            echo ""
            cat "$access_summary"
            echo ""
            echo "### Jira release readiness"
            echo ""
            echo "| Project | Jira version | Included issues | Pending issues | Current state | Readiness |"
            echo "|---|---:|---|---|---|---|"
            cat "$release_summary"
            echo ""
            cat "$pending_summary"
            echo ""
            if [[ "$DRY_RUN" == "true" ]]; then
              echo "> No Jira version was created or modified by this workflow."
            else
              echo "> Existing Jira versions are updated only after the final readiness search; no Jira version is created."
            fi
          } >>"$GITHUB_STEP_SUMMARY"

          if (( failed != 0 )); then
            echo "JIRA_BLOCKED=1" >>"$GITHUB_ENV"
          fi

      - name: Evaluate post-release outcome
        if: ${{ always() }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ "$GITHUB_BLOCKED" == "1" || "$JIRA_BLOCKED" == "1" ]]; then
            echo "::error::Post-release workflow found one or more blocking conditions; review the job summary"
            exit 1
          fi

          if [[ "$DRY_RUN" == "true" ]]; then
            echo "Post-release dry-run completed without blocking conditions."
          else
            echo "Post-release execution completed without blocking conditions."
          fi
