name: Release Open Hospital

on:
  push:
    paths-ignore:
      - '**.md'
    tags:
      - 'v*'
      - 'develop*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (X.Y.Z, without the leading v)'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

# Prevent two manual releases from moving the same set of tags concurrently.
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  tagging-readiness:
    name: Check tagging readiness
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/release-readiness.yml
    with:
      version: ${{ inputs.version }}
      phase: tagging
      enforcement: block
    secrets:
      JIRA_CLOUD_ID: ${{ secrets.JIRA_CLOUD_ID }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

  build-readiness:
    name: Check build readiness
    if: github.event_name == 'push'
    uses: ./.github/workflows/release-readiness.yml
    with:
      version: ${{ github.ref_name }}
      phase: ${{ github.event.deleted != true && startsWith(github.ref, 'refs/tags/v') && 'build' || 'development' }}
      enforcement: block
    secrets:
      JIRA_CLOUD_ID: ${{ secrets.JIRA_CLOUD_ID }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

  tag-release:
    name: Tag release branches
    needs: tagging-readiness
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      needs.tagging-readiness.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Validate version and derive names
        id: release
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must have the form X.Y.Z (for example 1.15.0)"
            exit 1
          fi

          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "branch=release_${VERSION//./_}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: informatici
          repositories: |
            openhospital
            openhospital-core
            openhospital-gui
            openhospital-api
            openhospital-doc
            openhospital-ui

      - name: Force component tags to their release branches
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO_OWNER: informatici
          RELEASE_BRANCH: ${{ steps.release.outputs.branch }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          repos=(
            openhospital-core
            openhospital-gui
            openhospital-api
            openhospital-doc
            openhospital-ui
          )

          move_tag() {
            local repo="$1"
            local target_sha current_sha

            target_sha="$(gh api \
              "repos/${GH_REPO_OWNER}/${repo}/git/ref/heads/${RELEASE_BRANCH}" \
              --jq '.object.sha')"

            if ! current_sha="$(gh api \
              "repos/${GH_REPO_OWNER}/${repo}/git/ref/tags/${RELEASE_TAG}" \
              --jq '.object.sha' 2>/dev/null)"; then
              current_sha=""
            fi

            if [[ -z "$current_sha" ]]; then
              gh api --method POST "repos/${GH_REPO_OWNER}/${repo}/git/refs" \
                -f "ref=refs/tags/${RELEASE_TAG}" \
                -f "sha=${target_sha}" >/dev/null
              echo "CREATE ${repo}:${RELEASE_TAG} -> ${target_sha}"
            elif [[ "$current_sha" == "$target_sha" ]]; then
              # PATCHing a ref to the same SHA may emit no push event. Recreate it.
              gh api --method DELETE \
                "repos/${GH_REPO_OWNER}/${repo}/git/refs/tags/${RELEASE_TAG}"
              gh api --method POST "repos/${GH_REPO_OWNER}/${repo}/git/refs" \
                -f "ref=refs/tags/${RELEASE_TAG}" \
                -f "sha=${target_sha}" >/dev/null
              echo "RECREATE ${repo}:${RELEASE_TAG} -> ${target_sha}"
            else
              gh api --method PATCH \
                "repos/${GH_REPO_OWNER}/${repo}/git/refs/tags/${RELEASE_TAG}" \
                -f "sha=${target_sha}" \
                -F force=true >/dev/null
              echo "MOVE   ${repo}:${RELEASE_TAG} -> ${target_sha}"
            fi
          }

          for repo in "${repos[@]}"; do
            move_tag "$repo"
          done

      - name: Force host tag last to trigger the build
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO_OWNER: informatici
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          APP_INSTALLATION_ID: ${{ steps.app-token.outputs.installation-id }}
        run: |
          set -euo pipefail

          repo=openhospital

          # Tag the exact commit from which this manual workflow was started
          # (normally the head of master). The host has no release_X_Y_Z branch.
          target_sha="${GITHUB_SHA}"
          
          if ! current_sha="$(gh api \
            "repos/${GH_REPO_OWNER}/${repo}/git/ref/tags/${RELEASE_TAG}" \
            --jq '.object.sha' 2>/dev/null)"; then
            current_sha=""
          fi

          if [[ -z "$current_sha" ]]; then
            gh api --method POST "repos/${GH_REPO_OWNER}/${repo}/git/refs" \
              -f "ref=refs/tags/${RELEASE_TAG}" \
              -f "sha=${target_sha}" >/dev/null
            echo "CREATE ${repo}:${RELEASE_TAG} -> ${target_sha}"
          elif [[ "$current_sha" == "$target_sha" ]]; then
            # The delete event is ignored by build below; the create event builds once.
            gh api --method DELETE \
              "repos/${GH_REPO_OWNER}/${repo}/git/refs/tags/${RELEASE_TAG}"
            gh api --method POST "repos/${GH_REPO_OWNER}/${repo}/git/refs" \
              -f "ref=refs/tags/${RELEASE_TAG}" \
              -f "sha=${target_sha}" >/dev/null
            echo "RECREATE ${repo}:${RELEASE_TAG} -> ${target_sha}"
          else
            gh api --method PATCH \
              "repos/${GH_REPO_OWNER}/${repo}/git/refs/tags/${RELEASE_TAG}" \
              -f "sha=${target_sha}" \
              -F force=true >/dev/null
            echo "MOVE   ${repo}:${RELEASE_TAG} -> ${target_sha}"
          fi

  build:
    needs: build-readiness
    # workflow_dispatch only moves tags; the host-tag push performs the build.
    # When retagging the same SHA, the tag is deleted and recreated to force a push event.
    # Ignore the deletion event so only the tag recreation triggers the build.
    if: >-
      github.event_name == 'push' &&
      github.event.deleted != true &&
      startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Java JDK
      uses: actions/setup-java@v6
      with:
        distribution: 'zulu'
        java-version: 17

    - name: Install asciidoctor
      run: sudo gem install asciidoctor-pdf --pre

    - name: Build OH distributions
      run: make
      env:
        CI: false

    - name: Create draft release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        draft: true
        files: |
          OpenHospital-*.tar.gz
          OpenHospital-*.zip
        body_path: RELEASE_NOTES.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Get current date
      id: date
      if: startsWith(github.ref, 'refs/tags/develop')
      run: echo "date=$(date +'%Y%m%d')" >> "$GITHUB_OUTPUT"

    - name: Rename artifact
      if: startsWith(github.ref, 'refs/tags/develop')
      run: |
        mv OpenHospital-develop-multiarch-client.zip OpenHospital-dev${{ steps.date.outputs.date }}-multiarch-client.zip
        mv OpenHospital-develop-x86_64-EXPERIMENTAL.zip OpenHospital-dev${{ steps.date.outputs.date }}-x86_64-EXPERIMENTAL.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Delete last dev release
      if: startsWith(github.ref, 'refs/tags/develop')
      uses: dev-drprasad/delete-older-releases@v0.2.1
      with:
        repo: informatici/openhospital
        keep_latest: 0
        delete_tag_pattern: develop
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create dev release
      if: startsWith(github.ref, 'refs/tags/develop')
      uses: softprops/action-gh-release@v1
      with:
        name: Develop Release ${{ steps.date.outputs.date }}
        prerelease: true
        files: |
          OpenHospital-dev${{ steps.date.outputs.date }}-multiarch-client.zip
          OpenHospital-dev${{ steps.date.outputs.date }}-x86_64-EXPERIMENTAL.zip
          # OpenHospital-*.tar.gz
          # OpenHospital-*.zip
        body: Development pre-release for testers
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
